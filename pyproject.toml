[project]
name = "applied-ai-lab"
version = "0.1.0"
description = "Applied AI Engineering Academy: a 24-week, project-based self-study lab."
readme = "README.md"
requires-python = ">=3.11"
# Week 1 deliberately uses a small dependency set so the principles stay visible.
# Heavier libraries (torch, sentence-transformers, fastapi, langgraph, mcp) are added
# as optional groups in the week that teaches them, after a compatibility check
# on Intel macOS.
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "courses"]
# importlib mode lets every week keep its own tests/ folder without name clashes.
addopts = "--import-mode=importlib -m 'not assignment'"
markers = [
    "assignment: tests for work YOU implement. Run with: pytest -m assignment <week path>",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Data and Markdown-template files hold long prose strings; wrapping them hurts readability.
"scripts/data_*.py" = ["E501"]
"scripts/scaffold.py" = ["E501"]
